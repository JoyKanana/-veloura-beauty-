<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var base = '/-veloura-beauty-/'
        var path = window.location.pathname
        var relative = path.indexOf(base) === 0
          ? path.slice(base.length)
          : path.replace(/^\//, '')
        var target = relative + window.location.search + window.location.hash
        window.location.replace(base + '?/' + encodeURIComponent(target))
      })()
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
